<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>715 Open</title>
<link rel="manifest" href="manifest.json?v=4">
<link rel="icon" href="favicon.png?v=4" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=4">
<meta name="theme-color" content="#101d35">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="715 Open">
<link rel="stylesheet" href="style.css?v=29">
</head>
<body>

<div class="sync-row">
  <div class="sync-indicator sync-connecting" id="syncIndicator">
    <span class="sync-dot"></span>
    <span class="sync-main" id="syncMain">Connecting</span>
  </div>
</div>

<header class="topbar">
  <div class="scoreboard" id="scoreboard">
    <div class="team-score team-a" id="teamABox">
      <span class="team-label">Team A</span>
      <span class="team-points" id="teamAPoints">0</span>
      <span class="team-roster">Pete &middot; Shane &middot; Bush</span>
    </div>
    <div class="team-score team-b" id="teamBBox">
      <span class="team-label">Team B</span>
      <span class="team-points" id="teamBPoints">0</span>
      <span class="team-roster">Cole &middot; Scarr &middot; Jordy</span>
    </div>
    <div class="scoreboard-badge" aria-hidden="true">&#127942;</div>
  </div>
</header>

<nav class="day-tabs" id="dayTabs"></nav>

<main id="app"></main>

<section class="beer-tracker" id="beerTracker">
  <h2>Shotgun Watch</h2>
  <p class="beer-sub">If Jov beats both singles players on a hole, that hole is pushed and both singles players shotgun a beer.</p>
  <div id="beerList" class="beer-list"></div>
</section>

<footer>
  <div class="footer-buttons">
    <button id="refreshBtn" class="refresh-btn"><span class="btn-icon">&#8635;</span>Refresh</button>
    <button id="resetBtn" class="reset-btn"><span class="btn-icon">&#8634;</span>Reset Tournament</button>
  </div>
  <p class="footnote">Scores sync automatically across everyone's devices.</p>
</footer>

<script src="app.js?v=5"></script>
</body>
</html>
